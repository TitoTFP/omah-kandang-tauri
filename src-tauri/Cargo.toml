[package]
name = "omah-kandang"
version = "0.1.0"
description = "Aplikasi pembukuan offline Omah Kandang"
authors = ["Tito"]
edition = "2021"

[lib]
name = "omah_kandang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
